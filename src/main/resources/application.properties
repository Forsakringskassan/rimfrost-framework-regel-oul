quarkus.index-dependency.rimfrost-handlaggning-adapter.group-id=se.fk.rimfrost.framework.handlaggning
quarkus.index-dependency.rimfrost-handlaggning-adapter.artifact-id=rimfrost-framework-handlaggning-adapter
quarkus.index-dependency.rimfrost-oul-adapter.group-id=se.fk.rimfrost.framework.oul
quarkus.index-dependency.rimfrost-oul-adapter.artifact-id=rimfrost-framework-oul-adapter

# JPA / storage — consumers must supply quarkus.datasource.jdbc.url,
# quarkus.flyway.default-schema, and regel.persistence.table-prefix.
quarkus.datasource.active=true
quarkus.hibernate-orm.enabled=true
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=${quarkus.flyway.default-schema}
quarkus.hibernate-orm.physical-naming-strategy=se.fk.rimfrost.framework.regel.oul.storage.internal.RegelPhysicalNamingStrategy
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=${quarkus.flyway.default-schema}

# REST setup
handlaggning.api.base-url=http://rimfrost-k8s-handlaggning:8080
