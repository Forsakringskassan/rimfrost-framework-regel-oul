# Quarkus needs to index rimfrost-framework-regel so its CDI beans
# (RegelKafkaProducer, etc.) are discovered when OulUppgiftService is built.
# Consumers set this in their own app.properties; we replicate it here for
# tests only.
quarkus.index-dependency.rimfrost-regel.group-id=se.fk.rimfrost.framework.regel
quarkus.index-dependency.rimfrost-regel.artifact-id=rimfrost-framework-regel

# Indexing regel also picks up the Kafka listener chain (RegelConsumer ->
# RegelMessageHandler -> RegelRequestHandlerInterface). The interface impl is
# provided by consumers, not this framework, so bean discovery must skip the
# whole chain in framework-owned tests.
quarkus.arc.exclude-types=se.fk.rimfrost.framework.regel.presentation.kafka.RegelMessageHandler,se.fk.rimfrost.framework.regel.presentation.kafka.RegelConsumer

# Storage — enabled in tests; Postgres via Quarkus dev services.
quarkus.datasource.active=true
quarkus.hibernate-orm.enabled=true
quarkus.flyway.default-schema=regel_oul_test
%test.quarkus.datasource.devservices.enabled=true
quarkus.kafka.devservices.enabled=false

# Table prefix + physical naming strategy: mirrors how consumers of regel-oul
# wire the framework — every framework table is prefixed with a per-service id
# so multiple regel services can share a schema without collision.
regel.persistence.table-prefix=regel_oul_test
quarkus.hibernate-orm.physical-naming-strategy=se.fk.rimfrost.framework.regel.oul.storage.internal.RegelPhysicalNamingStrategy

# Flyway: reroute to the test-side migration set whose table names already
# include the regel_oul_test_ prefix. Main migrations under db/migration/ are
# unprefixed and belong to the consuming service, not the framework's tests.
quarkus.flyway.locations=classpath:db/migration/oul

# Kafka — in-memory connector for regel-responses (produced by sendErrorResponse).
kafka.source=RegelOulTest
kafka.subtopic=oul-test
mp.messaging.outgoing.regel-responses.connector=smallrye-in-memory
mp.messaging.outgoing.regel-responses.topic=regel-response

# HTTP adapters — overridden at runtime by WireMockRegelOul (see start() map).
# The fallback values here are harmless placeholders used only if a test omits
# the @QuarkusTestResource annotation.
handlaggning.api.base-url=http://localhost:9999
oul.api.base-url=http://localhost:9999
